name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APKs & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon -Dkotlin.compiler.execution.strategy=in-process

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dkotlin.compiler.execution.strategy=in-process -Dksp.use.ksp2=true

      - name: Check & Prepare Release Signing Credentials
        id: prepare_release_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH_SECRET: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "Decoding production keystore from base64 secret..."
              echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
              echo "HAS_RELEASE_CREDENTIALS=true" >> $GITHUB_ENV
            elif [ -n "$KEYSTORE_PATH_SECRET" ] && [ -f "$KEYSTORE_PATH_SECRET" ]; then
              echo "Using production keystore from path secret..."
              echo "KEYSTORE_PATH=$KEYSTORE_PATH_SECRET" >> $GITHUB_ENV
              echo "HAS_RELEASE_CREDENTIALS=true" >> $GITHUB_ENV
            else
              echo "Keystore file not found. Skipping release build."
              echo "HAS_RELEASE_CREDENTIALS=false" >> $GITHUB_ENV
            fi
          else
            echo "Release signing credentials not provided in secrets. Skipping release build."
            echo "HAS_RELEASE_CREDENTIALS=false" >> $GITHUB_ENV
          fi

      - name: Build Release APK & Bundle
        if: env.HAS_RELEASE_CREDENTIALS == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon -Dkotlin.compiler.execution.strategy=in-process -Dksp.use.ksp2=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DownloadVideos-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success() && hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
        with:
          name: DownloadVideos-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release AAB (App Bundle)
        uses: actions/upload-artifact@v4
        if: success() && hashFiles('app/build/outputs/bundle/release/app-release.aab') != ''
        with:
          name: DownloadVideos-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
